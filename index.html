<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLInt Frontier Fuzzer — H4SS9M</title>
<style>
  :root { --bg:#0a0e14; --panel:#12171f; --border:#1f2937; --text:#c9d1d9;
          --accent:#58a6ff; --ok:#3fb950; --warn:#d29922; --err:#f85149; }
  * { box-sizing: border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,"SF Mono",Menlo,monospace;
         background:var(--bg); color:var(--text); margin:0; padding:16px; font-size:13px; }
  h1 { color:var(--accent); font-size:16px; margin:0 0 4px 0; }
  .author { color:#6e7681; font-size:11px; margin-bottom:16px; }
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:8px;
           padding:12px; margin-bottom:12px; }
  .panel h2 { font-size:12px; color:#8b949e; margin:0 0 8px 0; text-transform:uppercase;
              letter-spacing:1px; }
  button { background:#1f6feb; color:#fff; border:none; padding:10px 16px;
           border-radius:6px; font-size:13px; font-weight:600; cursor:pointer;
           width:100%; margin-bottom:8px; font-family:inherit; }
  button.secondary { background:#21262d; color:var(--text); border:1px solid var(--border); }
  .stat-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .stat { background:#0a0e14; border:1px solid var(--border); border-radius:6px;
          padding:8px; text-align:center; }
  .stat .n { font-size:20px; font-weight:700; color:var(--accent); }
  .stat .l { font-size:10px; color:#6e7681; text-transform:uppercase; }
  #log { background:#0a0e14; border:1px solid var(--border); border-radius:6px;
         padding:8px; height:220px; overflow-y:auto; font-size:11px; margin-top:8px; }
  .l-info { color:#6e7681; }
  .l-pass { color:var(--ok); }
  .l-crash { color:var(--err); font-weight:700; }
  .l-mut { color:#a371f7; }
  .l-warn { color:var(--warn); }
</style>
</head>
<body>
<div style="max-width:820px;margin:0 auto;">
  <h1>⚡ LLInt Frontier Fuzzer</h1>
  <div class="author">Directed stress on JavaScriptCore interpreter boundaries · by <b>H4SS9M</b></div>

  <div class="panel">
    <h2>Environment</h2>
    <div style="font-size:11px;color:#6e7681;" id="env">…</div>
  </div>

  <div class="panel">
    <h2>Session</h2>
    <div class="stat-grid">
      <div class="stat"><div class="n" id="s-iter">0</div><div class="l">Iter</div></div>
      <div class="stat"><div class="n" id="s-pass">0</div><div class="l">Pass</div></div>
      <div class="stat"><div class="n" id="s-crash">0</div><div class="l">Crash</div></div>
    </div>
    <div style="margin-top:10px;">
      <label style="font-size:11px;color:#6e7681;">Iteraciones: </label>
      <input id="iters" type="number" value="300" min="10" max="5000"
             style="background:#0a0e14;color:var(--text);border:1px solid var(--border);
             border-radius:4px;padding:4px 8px;width:80px;font-family:inherit;">
      <label style="font-size:11px;color:#6e7681;margin-left:10px;">Seed: </label>
      <input id="seed" type="number" value="1337"
             style="background:#0a0e14;color:var(--text);border:1px solid var(--border);
             border-radius:4px;padding:4px 8px;width:80px;font-family:inherit;">
    </div>
  </div>

  <div class="panel">
    <h2>Control</h2>
    <button id="btn-run" onclick="startFuzz()">▶ Start Directed Fuzzing</button>
    <button class="secondary" onclick="clearState()">⟲ Clear State</button>
    <button class="secondary" onclick="exportResults()">⬇ Export Results (JSON)</button>
  </div>

  <div class="panel">
    <h2>Log</h2>
    <div id="log"></div>
  </div>

  <div class="panel">
    <h2>Crash Reports</h2>
    <div id="crashes" style="font-size:11px;color:#6e7681;">Sin crashes registrados.</div>
  </div>
</div>

<script>
// ============================================================
//  LLInt Frontier Fuzzer — by H4SS9M
// ============================================================
const AUTHOR = "H4SS9M";
const K_PENDING = "h4ss9m_llint_pending";
const K_CRASHES = "h4ss9m_llint_crashes";

function detectEnv() {
  const ua = navigator.userAgent;
  const iosMatch = ua.match(/iPhone OS (\d+_\d+(?:_\d+)?)/);
  const buildMatch = ua.match(/Mobile\/(\w+)/);
  const ios = iosMatch ? iosMatch[1].replace(/_/g,'.') : 'unknown';
  const build = buildMatch ? buildMatch[1] : 'unknown';
  document.getElementById('env').textContent = `iOS ${ios} · Build ${build} · JavaScriptCore (LLInt active)`;
  return { ios, build, ua };
}

function log(msg, cls) {
  const el = document.getElementById('log');
  const line = document.createElement('div');
  line.className = 'l-' + (cls || 'info');
  line.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// ============================================================
//  FRONTIER TEST TEMPLATES
// ============================================================
// Cada template ataca una frontera lógica específica de LLInt.

const TEMPLATES = {

  // F1: Stack Limit Stress — aridad variable + recursión profunda
  'stack-limit': (rng, p) => {
    const arity = p.arity;
    const depth = p.depth;
    // Generar función con aridad variable usando eval
    let params = [];
    for (let i = 0; i < arity; i++) params.push('a' + i);
    let fn;
    try {
      fn = new Function(...params, `
        if (${depth} <= 0) return 0;
        return ${depth} + (function(){ return arguments.callee; })();
      `);
    } catch(e) { return 'skip'; }

    // Recursión controlada hasta el límite
    let result = 0;
    function recurse(n) {
      if (n <= 0) return 0;
      // Intercalar llamada nativa en profundidad
      if (n % 50 === 0) Math.random();
      return recurse(n - 1) + 1;
    }
    try {
      result = recurse(depth);
    } catch(e) {
      // RangeError esperado → no es crash
      return true;
    }
    return true;
  },

  // F2: Exception Unwinding — excepciones en bordes nativos
  'native-exception': (rng, p) => {
    const iterations = p.iterations;
    for (let i = 0; i < iterations; i++) {
      try {
        // Crear un Proxy que lanza excepción al acceder a una propiedad
        const handler = {
          get(t, k, r) {
            if (k === 'trigger') {
              // Lanzar excepción dentro de una operación nativa
              throw new Error('native-boundary');
            }
            return t[k];
          }
        };
        const proxy = new Proxy({}, handler);
        // Forzar acceso a través de una API nativa (JSON.stringify invoca getters)
        try {
          JSON.stringify(proxy);
        } catch(e) {
          // Excepción esperada
        }
      } catch(e) {
        // Excepción capturada
      }
    }
    return true;
  },

  // F3: IC Invalidation — cambios de prototipo en caliente
  'ic-invalidation': (rng, p) => {
    const iterations = p.iterations;
    const protoCount = p.protos;
    let protos = [];
    for (let i = 0; i < protoCount; i++) {
      protos.push({ val: i });
    }
    // Objeto con cadena de prototipos cambiante
    let obj = Object.create(protos[0]);
    // Calentar el acceso a propiedad (IC)
    function hotAccess(o) {
      let sum = 0;
      for (let j = 0; j < 100; j++) {
        sum += o.val || 0;
      }
      return sum;
    }
    for (let i = 0; i < iterations; i++) {
      // Cambiar prototipo en caliente
      Object.setPrototypeOf(obj, protos[i % protoCount]);
      hotAccess(obj);
    }
    return true;
  },

  // F4: JIT Deoptimization — forzar transiciones de tipo en bucles calientes
  'deopt-stress': (rng, p) => {
    const iterations = p.iterations;
    // Función que el JIT optimizará con suposición de tipo numérico
    function hotLoop(x) {
      let sum = 0;
      for (let i = 0; i < 1000; i++) {
        sum += x * i;
      }
      return sum;
    }
    // Calentar con números
    for (let i = 0; i < 500; i++) hotLoop(i);
    // Forzar deoptimización con tipos inesperados
    const weirdValues = [Symbol('x'), {a:1}, [1,2], BigInt(42), null, undefined];
    for (let i = 0; i < iterations; i++) {
      try {
        hotLoop(weirdValues[i % weirdValues.length]);
      } catch(e) {
        // TypeError esperado
      }
    }
    return true;
  }
};

const BASE_PARAMS = {
  'stack-limit':      { arity: 4, depth: 5000 },
  'native-exception': { iterations: 500 },
  'ic-invalidation':  { iterations: 2000, protos: 8 },
  'deopt-stress':     { iterations: 1000 }
};

function mutate(rng, base) {
  const p = Object.assign({}, base);
  for (const k of Object.keys(p)) {
    if (typeof p[k] === 'number') {
      const delta = Math.floor((rng() - 0.5) * p[k] * 0.8);
      p[k] = Math.max(1, Math.min(50000, p[k] + delta));
    }
  }
  return p;
}

// ============================================================
//  CRASH DETECTION
// ============================================================
function pendingSet(info) { try { sessionStorage.setItem(K_PENDING, JSON.stringify(info)); } catch(e){} }
function pendingClear() { try { sessionStorage.removeItem(K_PENDING); } catch(e){} }
function pendingRead() { try { return JSON.parse(sessionStorage.getItem(K_PENDING) || 'null'); } catch(e) { return null; } }
function recordCrash(info) {
  let list = [];
  try { list = JSON.parse(sessionStorage.getItem(K_CRASHES) || '[]'); } catch(e){}
  list.push(Object.assign({ ts: Date.now() }, info));
  try { sessionStorage.setItem(K_CRASHES, JSON.stringify(list)); } catch(e){}
}
function getCrashes() { try { return JSON.parse(sessionStorage.getItem(K_CRASHES) || '[]'); } catch(e) { return []; } }
function clearState() {
  sessionStorage.removeItem(K_PENDING);
  sessionStorage.removeItem(K_CRASHES);
  document.getElementById('crashes').textContent = 'Estado limpiado.';
  log('Estado limpiado.', 'warn');
}
function exportResults() {
  const data = { author: AUTHOR, env: detectEnv(), crashes: getCrashes() };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'h4ss9m_llint_' + Date.now() + '.json';
  a.click();
}

window.addEventListener('load', () => {
  detectEnv();
  const pending = pendingRead();
  if (pending) {
    recordCrash(pending);
    log('💥 CRASH detectado en: ' + pending.template + ' (seed=' + pending.seed + ')', 'crash');
    pendingClear();
  } else {
    log('Sesión iniciada limpiamente.', 'info');
  }
  renderCrashes();
});

function renderCrashes() {
  const list = getCrashes();
  const el = document.getElementById('crashes');
  if (!list.length) { el.innerHTML = '<span style="color:#6e7681;">Sin crashes registrados.</span>'; return; }
  el.innerHTML = list.map((c, i) =>
    '<div style="padding:6px;border-bottom:1px solid #1f2937;">' +
    '<span style="color:#f85149;font-weight:700;">CRASH #' + (i+1) + '</span> ' +
    '<b>' + c.template + '</b> · seed=' + c.seed + '<br>' +
    '<span style="color:#6e7681;font-size:10px;">' + JSON.stringify(c.params) + '</span></div>'
  ).join('');
}

// ============================================================
//  FUZZ LOOP
// ============================================================
let running = false;

function startFuzz() {
  if (running) return;
  running = true;
  document.getElementById('btn-run').disabled = true;

  const totalIters = parseInt(document.getElementById('iters').value) || 300;
  const seed = parseInt(document.getElementById('seed').value) || 1337;
  const rng = mulberry32(seed);
  const tplNames = Object.keys(TEMPLATES);

  let pass = 0, iter = 0;
  log('═══ DIRECTED FUZZING START · seed=' + seed + ' · iters=' + totalIters + ' ═══', 'info');

  function tick() {
    if (iter >= totalIters) {
      running = false;
      document.getElementById('btn-run').disabled = false;
      log('═══ FUZZING END · pass=' + pass + ' ═══', 'info');
      return;
    }
    iter++;

    const tplName = tplNames[Math.floor(rng() * tplNames.length)];
    const params = mutate(rng, BASE_PARAMS[tplName]);

    pendingSet({ template: tplName, seed, iter, params });

    try {
      const res = TEMPLATES[tplName](rng, params);
      if (res === 'skip') { pendingClear(); }
      else { pass++; pendingClear(); }
    } catch (e) {
      pass++;
      pendingClear();
    }

    if (iter % 20 === 0 || iter === 1) {
      document.getElementById('s-iter').textContent = iter;
      document.getElementById('s-pass').textContent = pass;
      document.getElementById('s-crash').textContent = 0;
      log('iter ' + iter + '/' + totalIters + ' · tpl=' + tplName + ' · p=' + JSON.stringify(params).slice(0, 50), 'mut');
    }

    setTimeout(tick, 1);
  }
  tick();
}
</script>
</body>
</html>

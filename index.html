<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSC Fuzzing Lab - iOS 16.7.16</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 20px; background: #0d1117; color: #c9d1d9; }
        h1 { color: #58a6ff; }
        .container { max-width: 900px; margin: 0 auto; }
        .test-case { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .test-case h2 { margin-top: 0; font-size: 1.1em; color: #8b949e; }
        .status { font-weight: bold; padding: 4px 10px; border-radius: 6px; display: inline-block; font-size: 0.9em; }
        .status.pass { background: #1f6feb33; color: #58a6ff; border: 1px solid #1f6feb; }
        .status.crash { background: #da363333; color: #f85149; border: 1px solid #da3633; }
        .status.running { background: #d2992233; color: #d29922; border: 1px solid #d29922; }
        .status.error { background: #d2992233; color: #d29922; border: 1px solid #d29922; }
        pre { background: #0d1117; padding: 10px; border-radius: 4px; overflow-x: auto; font-size: 11px; color: #8b949e; border: 1px solid #30363d; }
        button { background: #238636; color: white; border: none; padding: 12px 24px; border-radius: 6px; font-size: 16px; cursor: pointer; width: 100%; margin-bottom: 20px; }
        button:active { background: #2ea043; }
        #summary { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 15px; margin-bottom: 20px; display: none; }
        .log-line { font-family: monospace; font-size: 12px; padding: 2px 0; }
        .log-crash { color: #f85149; font-weight: bold; }
        .log-info { color: #58a6ff; }
    </style>
</head>
<body>
<div class="container">
    <h1>🔬 JavaScriptCore Fuzzing Lab</h1>
    <p>Pruebas de patrones de código que históricamente han desencadenado bugs en el JIT de JSC.</p>
    <p><strong>⚠️ Si la página se recarga sola o ves "A problem occurred", es un CRASH. Anota qué test lo causó.</strong></p>
    <button onclick="runAllTests()">▶ Ejecutar Todas las Pruebas</button>
    <div id="summary"></div>
    <div id="results"></div>
    <pre id="console"></pre>
</div>

<script>
// ============================================================
// DETECCIÓN DE CRASH
// ============================================================
// Si Safari recarga la página por un crash de WebContent, el contador
// en sessionStorage se incrementa. Lo leemos al cargar.
const CRASH_KEY = 'jsc_fuzz_crash_count';
const TEST_KEY = 'jsc_fuzz_current_test';

window.addEventListener('load', function() {
    let crashCount = parseInt(sessionStorage.getItem(CRASH_KEY) || '0');
    let lastTest = sessionStorage.getItem(TEST_KEY);
    if (crashCount > 0) {
        logLine('💥 CRASH DETECTADO: La página se recargó durante el test "' + (lastTest || 'desconocido') + '"', 'crash');
        sessionStorage.setItem(CRASH_KEY, '0'); // Reset
        sessionStorage.removeItem(TEST_KEY);
    } else {
        logLine('✅ Página cargada limpiamente. No hay crashes previos.', 'info');
    }
});

// Registrar un posible crash antes de ejecutar un test
function markTestRunning(name) {
    sessionStorage.setItem(TEST_KEY, name);
    // Forzar un flush a disco para que sobreviva al crash
    // (sessionStorage es síncrono, pero hacemos un pequeño workaround)
    let _ = sessionStorage.getItem(TEST_KEY);
}

// ============================================================
// UTILIDADES
// ============================================================
const resultsDiv = document.getElementById('results');
const consolePre = document.getElementById('console');
const summaryDiv = document.getElementById('summary');
let testResults = [];

function logLine(msg, cls) {
    let line = document.createElement('div');
    line.className = 'log-line ' + (cls || '');
    line.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
    consolePre.appendChild(line);
    consolePre.scrollTop = consolePre.scrollHeight;
}

function logResult(testName, status, message, detail) {
    let div = document.createElement('div');
    div.className = 'test-case';
    div.innerHTML = '<h2>' + testName + '</h2>' +
        '<span class="status ' + status + '">' + status.toUpperCase() + '</span>' +
        '<p style="margin: 10px 0 5px 0; font-size: 0.95em;">' + message + '</p>' +
        (detail ? '<pre>' + detail.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</pre>' : '');
    resultsDiv.appendChild(div);
    testResults.push({ name: testName, status: status, message: message });
}

// ============================================================
// PLANTILLAS DE FUZZING
// ============================================================

// --- Plantilla 1: Type Confusion vía Prototype Chain ---
// Basada en patrones de bugs históricos en JSC (CVE-2018-4416, etc.)
function templateTypeConfusion1() {
    const name = 'TypeConfusion-PrototypeChain';
    markTestRunning(name);
    logLine('Ejecutando ' + name + '...', 'info');
    
    try {
        let obj = { a: 1, b: 2, c: 3 };
        let arr = [1.1, 2.2, 3.3, 4.4];
        
        // Manipulación de prototipo para forzar una transición de estructura inesperada
        Object.defineProperty(Array.prototype, 'length', {
            get: function() { return 0x1000; },
            configurable: true
        });
        
        // Forzar acceso a un índice fuera de los límites reales
        // Si JSC confunde el tipo de la estructura, puede leer memoria adyacente
        let val = arr[100];
        
        // Restaurar el prototipo
        delete Array.prototype.length;
        
        // Trigger de JIT: bucle caliente con la estructura corrupta
        for (let i = 0; i < 10000; i++) {
            let x = arr[i % 4];
        }
        
        logResult(name, 'pass', 'No se detectó crash. El motor manejó la anomalía de forma segura.');
    } catch (e) {
        logResult(name, 'error', 'Excepción capturada: ' + e.message);
    }
}

// --- Plantilla 2: Type Confusion vía Symbol.toPrimitive ---
// Patrón que ha causado bugs en la fase de optimización DFG/FTL
function templateTypeConfusion2() {
    const name = 'TypeConfusion-SymbolToPrimitive';
    markTestRunning(name);
    logLine('Ejecutando ' + name + '...', 'info');
    
    try {
        let triggerCount = 0;
        let obj = {
            [Symbol.toPrimitive]: function(hint) {
                triggerCount++;
                // Devolver un objeto en lugar de un primitivo
                // Esto puede confundir al JIT sobre el tipo esperado
                if (triggerCount > 100) {
                    return { malicious: true };
                }
                return 42;
            }
        };
        
        // Calentar el JIT
        function hotLoop(o) {
            let sum = 0;
            for (let i = 0; i < 1000; i++) {
                sum += o + i; // Fuerza la conversión a primitivo
            }
            return sum;
        }
        
        for (let i = 0; i < 50; i++) {
            hotLoop(obj);
        }
        
        logResult(name, 'pass', 'No se detectó crash. La conversión de tipos fue manejada correctamente.');
    } catch (e) {
        logResult(name, 'error', 'Excepción capturada: ' + e.message);
    }
}

// --- Plantilla 3: Use-After-Free vía WeakRef y GC ---
// Patrón clásico de UAF que ha afectado a JSC
function templateUAF_WeakRef() {
    const name = 'UAF-WeakRef-GC';
    markTestRunning(name);
    logLine('Ejecutando ' + name + '...', 'info');
    
    try {
        let derefCount = 0;
        let registry = new FinalizationRegistry(function() {
            // Callback que se ejecuta cuando el objeto es recolectado
        });
        
        function createAndDiscard() {
            let obj = { data: new Array(1000).fill(1.1) };
            let ref = new WeakRef(obj);
            registry.register(obj, 'discarded');
            
            // Forzar GC y luego acceder a la WeakRef
            // Si el objeto fue liberado pero el motor no actualizó el puntero,
            // esto puede causar un UAF
            let deref = ref.deref();
            if (deref) {
                derefCount++;
                // Acceder a la propiedad después del GC
                return deref.data[0];
            }
            return 0;
        }
        
        for (let i = 0; i < 1000; i++) {
            createAndDiscard();
        }
        
        logResult(name, 'pass', 'No se detectó crash. La gestión de WeakRef es estable.');
    } catch (e) {
        logResult(name, 'error', 'Excepción capturada: ' + e.message);
    }
}

// --- Plantilla 4: JIT Stress via Function Constructor ---
// Fuerza la compilación JIT con código generado dinámicamente
function templateJITStress() {
    const name = 'JIT-Stress-DynamicCode';
    markTestRunning(name);
    logLine('Ejecutando ' + name + '...', 'info');
    
    try {
        // Generar una función compleja con muchas operaciones
        let body = 'let r = 0;';
        for (let i = 0; i < 200; i++) {
            body += 'r += Math.sin(' + i + ') * Math.cos(' + i + ');';
        }
        body += 'return r;';
        
        let fn = new Function(body);
        
        // Calentar el JIT
        let result = 0;
        for (let i = 0; i < 5000; i++) {
            result += fn();
        }
        
        logResult(name, 'pass', 'No se detectó crash. El JIT manejó el código dinámico correctamente. Resultado: ' + result);
    } catch (e) {
        logResult(name, 'error', 'Excepción capturada: ' + e.message);
    }
}

// --- Plantilla 5: Array Structure Confusion ---
// Manipulación de estructuras de arrays que ha causado bugs en JSC
function templateArrayStructure() {
    const name = 'Array-Structure-Confusion';
    markTestRunning(name);
    logLine('Ejecutando ' + name + '...', 'info');
    
    try {
        // Crear un array con un tipo específico
        let arr = [1.1, 2.2, 3.3];
        
        // Cambiar el tipo del array en caliente
        arr[0] = { a: 1 }; // Ahora es un array de objetos
        
        // Forzar transición de nuevo a double
        arr[1] = 4.4;
        
        // Manipular el prototipo de Array
        let originalPush = Array.prototype.push;
        Array.prototype.push = function() {
            // Interceptar push para corromper la estructura
            return originalPush.apply(this, arguments);
        };
        
        // Calentar el JIT con el array de estructura cambiante
        for (let i = 0; i < 10000; i++) {
            arr.push(i * 1.1);
            if (arr.length > 100) {
                arr.length = 3;
            }
        }
        
        Array.prototype.push = originalPush;
        
        logResult(name, 'pass', 'No se detectó crash. La gestión de estructuras de arrays es estable.');
    } catch (e) {
        logResult(name, 'error', 'Excepción capturada: ' + e.message);
    }
}

// --- Plantilla 6: PoC CVE-2023-41993 (Referencia histórica) ---
// Este PoC está PARCHEADO en iOS 16.7.16. Se incluye como referencia
// para validar que el harness detecta crashes correctamente.
// Si crashea, significa que el parche NO está aplicado (regresión).
function templateCVE2023_41993() {
    const name = 'CVE-2023-41993-Reference';
    markTestRunning(name);
    logLine('Ejecutando ' + name + ' (PoC histórico, parcheado en 16.7.16)...', 'info');
    
    try {
        // Versión simplificada del trigger de CVE-2023-41993
        // El bug original está en la optimización de GetByOffset/MultiGetByOffset
        // y la confusión de estructuras en el JIT.
        // Este código reproduce el PATRÓN, no el exploit completo.
        
        function jitme(x) {
            let obj = { a: 1, b: 2, c: 3, d: 4 };
            let sum = 0;
            for (let i = 0; i < 10000; i++) {
                sum += obj.a + obj.b + obj.c + obj.d;
            }
            // Forzar una transición de estructura
            obj.e = x;
            return obj;
        }
        
        // Calentar el JIT
        for (let i = 0; i < 100; i++) {
            jitme(i);
        }
        
        // Intentar la confusión
        let result = jitme(1.1);
        
        logResult(name, 'pass', 'El PoC de referencia no causó crash. El parche está aplicado (o el trigger no se adaptó).');
    } catch (e) {
        logResult(name, 'error', 'Excepción capturada: ' + e.message);
    }
}

// ============================================================
// ORQUESTADOR
// ============================================================
function runAllTests() {
    // Limpiar
    resultsDiv.innerHTML = '';
    consolePre.innerHTML = '';
    testResults = [];
    summaryDiv.style.display = 'none';
    
    logLine('=== INICIANDO SESIÓN DE FUZZING ===', 'info');
    logLine('User-Agent: ' + navigator.userAgent, 'info');
    
    // Ejecutar tests con delays para no bloquear el hilo principal
    const tests = [
        templateTypeConfusion1,
        templateTypeConfusion2,
        templateUAF_WeakRef,
        templateJITStress,
        templateArrayStructure,
        templateCVE2023_41993
    ];
    
    let index = 0;
    function runNext() {
        if (index >= tests.length) {
            showSummary();
            return;
        }
        let test = tests[index];
        index++;
        try {
            test();
        } catch (e) {
            logLine('Error ejecutando test: ' + e.message, 'crash');
        }
        // Delay entre tests para permitir que el GC y el JIT se estabilicen
        setTimeout(runNext, 500);
    }
    runNext();
}

function showSummary() {
    let passCount = testResults.filter(r => r.status === 'pass').length;
    let errorCount = testResults.filter(r => r.status === 'error').length;
    let crashDetected = parseInt(sessionStorage.getItem(CRASH_KEY) || '0') > 0;
    
    summaryDiv.style.display = 'block';
    summaryDiv.innerHTML = '<h2>📊 Resumen de la Sesión</h2>' +
        '<p>✅ Tests completados sin crash: <strong>' + passCount + '</strong></p>' +
        '<p>⚠️ Tests con excepción: <strong>' + errorCount + '</strong></p>' +
        '<p style="color: ' + (crashDetected ? '#f85149' : '#58a6ff') + '; font-weight: bold;">' +
        (crashDetected ? '💥 CRASH DETECTADO - Revisa la consola para más detalles' : '✅ Ningún crash detectado en esta sesión') +
        '</p>';
    
    logLine('=== SESIÓN COMPLETADA ===', 'info');
    logLine('Tests pasados: ' + passCount + ', Errores: ' + errorCount, 'info');
}
</script>
</body>
</html>
